name: Gerar APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abrir o zip
        run: unzip -o ./*.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Criar a parte Android
        working-directory: vida_em_dia
        run: |
          flutter create --platforms=android --org com.alvovita --project-name alvo_vita "$RUNNER_TEMP/base"
          cp -r "$RUNNER_TEMP/base/android" ./android

      - name: Nome do app e permissoes
        working-directory: vida_em_dia
        run: |
          python3 - <<'PYEOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'android:label="[^"]*"', 'android:label="Alvo Vita"', s, count=1)
          nomes = ['ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_LOCATION', 'POST_NOTIFICATIONS', 'WAKE_LOCK', 'INTERNET']
          perms = ''.join('    <uses-permission android:name="android.permission.' + n + '"/>\n' for n in nomes)
          s = s.replace('<application', perms + '    <application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PYEOF

      - name: Baixar dependencias
        working-directory: vida_em_dia
        run: flutter pub get

      - name: Gerar o APK
        working-directory: vida_em_dia
        run: flutter build apk --debug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: alvo-vita-apk
          path: vida_em_dia/build/app/outputs/flutter-apk/app-debug.apk
